name: Build Ascension Lord of Shadows

on:
  push:
    branches: [ jogo-ascensao-v1 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ascension-Lord-of-Shadows-V1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Ascension-Lord-of-Shadows-V1.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ascension-v1-build-${{ github.run_number }}"
          gh release create "$TAG" Ascension-Lord-of-Shadows-V1.apk \
            --title "Ascension: Lord of Shadows — V1 — $TAG" \
            --generate-notes

# Build trigger refreshed for Ascension V1
