name: Compilar Calculadora, Arena Hero e Truco V2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar projetos
        run: gradle --no-daemon --stacktrace assembleDebug bundleRelease :game:assembleDebug :truco:assembleDebug

      - name: Verificar arquivos gerados
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/bundle/release/app-release.aab
          test -f game/build/outputs/apk/debug/game-debug.apk
          test -f truco/build/outputs/apk/debug/truco-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh game/build/outputs/apk/debug/game-debug.apk
          ls -lh truco/build/outputs/apk/debug/truco-debug.apk
          ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: Disponibilizar APK da calculadora
        uses: actions/upload-artifact@v4
        with:
          name: CalculadoraCofreV2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Disponibilizar APK do Arena Hero
        uses: actions/upload-artifact@v4
        with:
          name: ArenaHeroV2-APK-v2.0
          path: game/build/outputs/apk/debug/game-debug.apk
          if-no-files-found: error

      - name: Disponibilizar APK do Truco V2
        uses: actions/upload-artifact@v4
        with:
          name: TrucoIA-V2-APK
          path: truco/build/outputs/apk/debug/truco-debug.apk
          if-no-files-found: error

      - name: Disponibilizar AAB da calculadora
        uses: actions/upload-artifact@v4
        with:
          name: CalculadoraCofreV2-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Preparar arquivos para Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CalculadoraCofreV2-teste.apk
          cp game/build/outputs/apk/debug/game-debug.apk ArenaHeroV2-2.0-teste.apk
          cp truco/build/outputs/apk/debug/truco-debug.apk TrucoIA-V2-teste.apk
          cp app/build/outputs/bundle/release/app-release.aab CalculadoraCofreV2.aab

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.0-build-${{ github.run_number }}"
          gh release create "$TAG" CalculadoraCofreV2-teste.apk ArenaHeroV2-2.0-teste.apk TrucoIA-V2-teste.apk CalculadoraCofreV2.aab             --title "Truco IA V2 + Arena Hero + Calculadora - $TAG"             --generate-notes
