name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle --no-daemon --stacktrace --info assembleDebug

      - name: Verificar APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: CalculadoraCofreV2
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Preparar APK para Release
        run: cp app/build/outputs/apk/debug/app-debug.apk CalculadoraCofreV2.apk

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.0-build-${{ github.run_number }}"
          gh release create "$TAG" CalculadoraCofreV2.apk \
            --title "Calculadora Cofre V2 - $TAG" \
            --generate-notes
