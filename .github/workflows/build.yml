name: Compilar e publicar AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK e Android App Bundle
        run: gradle --no-daemon --stacktrace --info assembleDebug bundleRelease

      - name: Verificar APK e AAB
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: Disponibilizar APK de teste como artefato
        uses: actions/upload-artifact@v4
        with:
          name: CalculadoraCofreV2-APK-v4.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Disponibilizar AAB como artefato
        uses: actions/upload-artifact@v4
        with:
          name: CalculadoraCofreV2-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Preparar AAB para Release
        run: cp app/build/outputs/bundle/release/app-release.aab CalculadoraCofreV2.aab

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="play-v4.0-build-${{ github.run_number }}"
          gh release create "$TAG" CalculadoraCofreV2.aab \
            --title "Calculadora Cofre V2 - Google Play - $TAG" \
            --generate-notes
